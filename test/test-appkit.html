<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIWE Reown AppKit Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #0f0f1a;
            color: #eee;
        }
        h1 { color: #3b82f6; margin-bottom: 10px; }
        h2 { color: #64748b; font-size: 14px; font-weight: normal; margin-top: 0; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px 5px 10px 0;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #334155; cursor: not-allowed; }
        #status {
            background: #1e1e2e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warn { color: #f59e0b; }
        .config {
            background: #1e1e2e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .config label { display: block; margin-bottom: 5px; color: #94a3b8; }
        .config input {
            width: 100%;
            padding: 10px;
            background: #0f0f1a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: white;
            font-family: monospace;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>SIWE Reown AppKit Test</h1>
    <h2>Test the new AppKit bundle for Chrome compatibility</h2>
    
    <div class="config">
        <label for="projectId">WalletConnect Project ID:</label>
        <input type="text" id="projectId" placeholder="Get one at https://cloud.walletconnect.com" value="">
        <small style="color: #64748b;">Required for WalletConnect. Leave empty to test with injected wallet only.</small>
    </div>
    
    <button id="initBtn">1. Initialize AppKit</button>
    <button id="connectBtn" disabled>2. Connect Wallet</button>
    <button id="signBtn" disabled>3. Sign Test Message</button>
    
    <div id="status">
        <p class="info">Click "Initialize AppKit" to start...</p>
    </div>

    <!-- Load the new AppKit bundle -->
    <script src="../public/javascripts/appkit-bundle.min.js"></script>
    
    <script>
        let modal = null;
        let wagmiAdapter = null;
        let provider = null;
        let connectedAddress = null;
        
        const statusDiv = document.getElementById('status');
        const initBtn = document.getElementById('initBtn');
        const connectBtn = document.getElementById('connectBtn');
        const signBtn = document.getElementById('signBtn');
        const projectIdInput = document.getElementById('projectId');
        
        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            statusDiv.appendChild(p);
            statusDiv.scrollTop = statusDiv.scrollHeight;
            console.log(`[${type}]`, message);
        }
        
        function logError(error) {
            log(`Error: ${error.message || error}`, 'error');
            console.error(error);
        }
        
        // Step 1: Initialize AppKit
        initBtn.addEventListener('click', async () => {
            statusDiv.innerHTML = '';
            log('Starting Reown AppKit initialization...');
            
            try {
                // Check if bundle loaded
                if (!window.ReownAppKit) {
                    throw new Error('ReownAppKit not loaded. Check if appkit-bundle.min.js loaded correctly.');
                }
                log('AppKit bundle loaded successfully', 'success');
                
                const { createAppKit, WagmiAdapter, networks } = window.ReownAppKit;
                const projectId = projectIdInput.value.trim() || 'demo-project-id';
                
                log(`Using project ID: ${projectId.substring(0, 10)}...`, 'info');
                log('Creating WagmiAdapter...', 'info');
                
                // Create Wagmi adapter
                wagmiAdapter = new WagmiAdapter({
                    projectId,
                    networks: [networks.mainnet, networks.polygon]
                });
                log('WagmiAdapter created', 'success');
                
                log('Creating AppKit modal...', 'info');
                
                // Create AppKit modal
                modal = createAppKit({
                    adapters: [wagmiAdapter],
                    networks: [networks.mainnet, networks.polygon],
                    projectId,
                    metadata: {
                        name: 'SIWE Test',
                        description: 'Testing Sign-In with Ethereum',
                        url: window.location.origin,
                        icons: ['https://avatars.githubusercontent.com/u/179229932']
                    },
                    features: {
                        analytics: false
                    },
                    themeVariables: {
                        '--w3m-z-index': '99999'
                    }
                });
                log('AppKit modal created', 'success');
                
                // Subscribe to providers
                modal.subscribeProviders((providers) => {
                    provider = providers['eip155'];
                    if (provider) {
                        log('EIP-155 provider available', 'success');
                    }
                });
                
                // Subscribe to account changes
                modal.subscribeAccount((account) => {
                    if (account.isConnected && account.address) {
                        connectedAddress = account.address;
                        log(`Connected: ${account.address.slice(0, 6)}...${account.address.slice(-4)}`, 'success');
                        signBtn.disabled = false;
                    } else if (!account.isConnected && connectedAddress) {
                        log('Disconnected', 'warn');
                        connectedAddress = null;
                        signBtn.disabled = true;
                    }
                });
                
                log('AppKit initialized successfully!', 'success');
                log('Ready to connect wallet.', 'info');
                initBtn.disabled = true;
                connectBtn.disabled = false;
                
            } catch (error) {
                logError(error);
            }
        });
        
        // Step 2: Open modal
        connectBtn.addEventListener('click', () => {
            log('Opening AppKit modal...', 'info');
            try {
                modal.open();
            } catch (error) {
                logError(error);
            }
        });
        
        // Step 3: Sign message
        signBtn.addEventListener('click', async () => {
            if (!connectedAddress) {
                log('No account connected', 'error');
                return;
            }
            
            if (!provider) {
                log('Provider not available yet, waiting...', 'warn');
                await new Promise(resolve => setTimeout(resolve, 1000));
                if (!provider) {
                    log('Provider still not available', 'error');
                    return;
                }
            }
            
            log('Requesting signature via personal_sign...', 'info');
            try {
                const message = `Sign in to SIWE Test\n\nTimestamp: ${new Date().toISOString()}`;
                
                const signature = await provider.request({
                    method: 'personal_sign',
                    params: [message, connectedAddress]
                });
                
                log(`Signature received!`, 'success');
                log(`Sig: ${signature.slice(0, 30)}...${signature.slice(-10)}`, 'info');
            } catch (error) {
                logError(error);
            }
        });
        
        // Initial check
        log('Test page loaded. Browser: ' + navigator.userAgent.split(' ').pop(), 'info');
        log('Checking for injected wallet (window.ethereum)...', 'info');
        if (window.ethereum) {
            log('Injected wallet detected (MetaMask/etc)', 'success');
        } else {
            log('No injected wallet - WalletConnect will be used', 'warn');
        }
    </script>
</body>
</html>
