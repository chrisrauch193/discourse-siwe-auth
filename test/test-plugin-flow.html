<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIWE Plugin Flow Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #0f0f1a;
            color: #eee;
        }
        h1 { color: #3b82f6; margin-bottom: 10px; }
        h2 { color: #64748b; font-size: 14px; font-weight: normal; margin-top: 0; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px 5px 10px 0;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #334155; cursor: not-allowed; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        #status {
            background: #1e1e2e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warn { color: #f59e0b; }
        .config {
            background: #1e1e2e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .config label { display: block; margin-bottom: 5px; color: #94a3b8; }
        .config input, .config select {
            width: 100%;
            padding: 10px;
            background: #0f0f1a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: white;
            font-family: monospace;
            margin-bottom: 10px;
        }
        .form-result {
            background: #1e1e2e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #334155;
        }
        .form-result h3 { margin-top: 0; color: #3b82f6; }
        .form-result pre {
            background: #0f0f1a;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .checkbox-row input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        .checkbox-row label {
            margin: 0;
            color: #94a3b8;
        }
        .section-title {
            color: #f59e0b;
            font-size: 12px;
            text-transform: uppercase;
            margin: 15px 0 10px 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <h1>SIWE Plugin Flow Test</h1>
    <h2>Simulates the full Discourse plugin flow - matches actual plugin code</h2>
    
    <div class="config">
        <label for="projectId">WalletConnect Project ID:</label>
        <input type="text" id="projectId" placeholder="Get one at https://cloud.walletconnect.com" value="">
        
        <label for="chainId">Expected Chain ID:</label>
        <select id="chainId">
            <option value="11155111">Sepolia (11155111)</option>
            <option value="1">Ethereum Mainnet (1)</option>
            <option value="137">Polygon (137)</option>
        </select>
        
        <div class="section-title">Backend Options</div>
        <div class="checkbox-row">
            <input type="checkbox" id="useMockBackend" checked>
            <label for="useMockBackend">Use Mock Backend (no CORS issues - for testing JS flow)</label>
        </div>
        
        <label for="backendUrl">Real Backend URL (if mock disabled):</label>
        <input type="text" id="backendUrl" placeholder="https://forum.chrisrauch.org" value="https://forum.chrisrauch.org">
        
        <div class="section-title">Debug Options</div>
        <div class="checkbox-row">
            <input type="checkbox" id="skipChainValidation">
            <label for="skipChainValidation">Skip chain validation (for testing when WalletConnect reports wrong chain)</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="simulateDuplicate">
            <label for="simulateDuplicate">Simulate duplicate init (tests the bug we fixed)</label>
        </div>
    </div>
    
    <button id="testBtn">Test Full Plugin Flow</button>
    <button id="resetBtn">Reset</button>
    <button id="hardResetBtn" class="danger">Hard Reset (clears all state)</button>
    
    <div id="status">
        <p class="info">Click "Test Full Plugin Flow" to simulate the Discourse plugin...</p>
    </div>
    
    <div id="formResult" class="form-result" style="display: none;">
        <h3>Form Submission Result (simulates Discourse callback)</h3>
        <pre id="formData"></pre>
    </div>

    <!-- Load the AppKit bundle -->
    <script src="../public/javascripts/appkit-bundle.min.js"></script>
    
    <script>
        // ============================================
        // MOCK BACKEND - Simulates Discourse SIWE endpoints
        // ============================================
        const MockBackend = {
            _nonce: null,
            _nonceGeneratedAt: null,
            
            generateNonce() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let nonce = '';
                for (let i = 0; i < 16; i++) {
                    nonce += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return nonce;
            },
            
            getMessage(ethAccount, chainId) {
                // Generate new nonce (this is what causes the bug when called twice!)
                this._nonce = this.generateNonce();
                this._nonceGeneratedAt = new Date().toISOString();
                
                log(`[MockBackend] Generated nonce: ${this._nonce}`, 'info');
                
                const domain = window.location.host;
                const uri = window.location.origin;
                const issuedAt = new Date().toISOString();
                
                const message = `${domain} wants you to sign in with your Ethereum account:
${ethAccount}

Sign-in to Discourse via Wallet

URI: ${uri}
Version: 1
Chain ID: ${chainId}
Nonce: ${this._nonce}
Issued At: ${issuedAt}`;
                
                return { message };
            },
            
            validateCallback(ethMessage, ethSignature) {
                // Extract nonce from message
                const nonceMatch = ethMessage.match(/Nonce: ([A-Za-z0-9]+)/);
                const messageNonce = nonceMatch ? nonceMatch[1] : null;
                
                log(`[MockBackend] Validating - Message nonce: ${messageNonce}, Stored nonce: ${this._nonce}`, 'info');
                
                if (!this._nonce) {
                    return { success: false, error: 'session_expired', message: 'No nonce in session' };
                }
                
                if (messageNonce !== this._nonce) {
                    return { 
                        success: false, 
                        error: 'invalid_nonce', 
                        message: `Nonce mismatch! Expected: ${this._nonce}, Got: ${messageNonce}` 
                    };
                }
                
                // In real backend, we'd verify the signature here
                // For testing, we just check the nonce
                return { success: true };
            },
            
            reset() {
                this._nonce = null;
                this._nonceGeneratedAt = null;
                log('[MockBackend] Reset - nonce cleared', 'info');
            }
        };
        
        // ============================================
        // WEB3MODAL CLASS - Matches actual plugin code
        // ============================================
        
        // Network configurations (same as plugin)
        const NETWORK_CONFIGS = {
            1: { id: 1, name: 'Ethereum', rpcUrl: 'https://eth.llamarpc.com' },
            11155111: { id: 11155111, name: 'Sepolia', rpcUrl: 'https://rpc.sepolia.org' },
            137: { id: 137, name: 'Polygon', rpcUrl: 'https://polygon-rpc.com' },
        };
        
        class Web3Modal {
            constructor() {
                this.modal = null;
                this.wagmiAdapter = null;
                this.provider = null;
                this.connectedAddress = null;
                this._currentUnsubscribe = null;
                this._expectedWallet = null;
                this._returnTo = null;
                this._expectedChainId = null;
                this._expectedChainName = null;
            }
            
            parseUrlParams() {
                const params = new URLSearchParams(window.location.search);
                
                const wallet = params.get('wallet');
                if (wallet && wallet.startsWith('0x')) {
                    this._expectedWallet = wallet.toLowerCase();
                    log('[SIWE] Expected wallet from URL: ' + this._expectedWallet, 'info');
                }
                
                const returnTo = params.get('return_to');
                if (returnTo) {
                    this._returnTo = returnTo;
                    log('[SIWE] Return URL: ' + this._returnTo, 'info');
                }
                
                return { wallet: this._expectedWallet, returnTo: this._returnTo };
            }
            
            async providerInit(env) {
                const { createAppKit, WagmiAdapter, networks } = window.ReownAppKit;
                const projectId = env.PROJECT_ID;
                
                // Store expected chain from settings
                this._expectedChainId = env.CHAIN_ID ? parseInt(env.CHAIN_ID, 10) : null;
                this._expectedChainName = env.CHAIN_NAME || null;
                
                log('[SIWE] Expected chain: ' + this._expectedChainId + ' ' + this._expectedChainName, 'info');
                
                const siteUrl = window.location.origin;
                const siteName = 'SIWE Test';
                
                // Determine which network to use
                let targetNetwork = networks.mainnet;
                let networkList = [networks.mainnet, networks.sepolia];
                
                if (this._expectedChainId) {
                    const chainMap = {
                        1: networks.mainnet,
                        11155111: networks.sepolia,
                        137: networks.polygon,
                    };
                    
                    if (chainMap[this._expectedChainId]) {
                        targetNetwork = chainMap[this._expectedChainId];
                        networkList = [targetNetwork];
                    }
                }
                
                const wagmiAdapter = new WagmiAdapter({
                    projectId,
                    networks: networkList
                });
                this.wagmiAdapter = wagmiAdapter;
                
                const modal = createAppKit({
                    adapters: [wagmiAdapter],
                    networks: networkList,
                    defaultNetwork: targetNetwork,
                    projectId,
                    metadata: {
                        name: siteName,
                        description: 'Sign in with Ethereum',
                        url: siteUrl,
                        icons: [`${siteUrl}/favicon.ico`]
                    },
                    features: {
                        analytics: false,
                        email: false,
                        socials: false
                    },
                    themeVariables: {
                        '--w3m-z-index': '99999'
                    }
                });
                
                this.modal = modal;
                
                modal.subscribeProviders((providers) => {
                    this.provider = providers['eip155'];
                });
                
                return modal;
            }
            
            async signMessage(address) {
                let name = null;
                let avatar = null;
                
                // Get chain ID from provider
                let chainId = 1;
                try {
                    const chainIdHex = await this.provider.request({ method: 'eth_chainId' });
                    chainId = parseInt(chainIdHex, 16);
                    log('[SIWE] Connected chain ID: ' + chainId, 'info');
                } catch (error) {
                    log('[SIWE] Chain ID error: ' + error, 'error');
                }
                
                // Check if on the expected chain
                const skipChainCheck = document.getElementById('skipChainValidation').checked;
                if (this._expectedChainId && chainId !== this._expectedChainId) {
                    if (skipChainCheck) {
                        log('[SIWE] Chain mismatch but SKIPPING validation (debug mode)', 'warn');
                        log('[SIWE] Expected: ' + this._expectedChainId + ', Got: ' + chainId, 'warn');
                        // Use the expected chain ID for the message anyway
                        chainId = this._expectedChainId;
                    } else {
                        const networkName = this._expectedChainName || `Chain ${this._expectedChainId}`;
                        const errorMsg = `Please switch to ${networkName} (Chain ID: ${this._expectedChainId}) to sign in.`;
                        log('[SIWE] Wrong network: ' + errorMsg, 'error');
                        
                        // Try to request network switch
                        try {
                            await this.provider.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0x' + this._expectedChainId.toString(16) }]
                            });
                            
                            await new Promise(resolve => setTimeout(resolve, 500));
                            
                            // VERIFY switch actually worked
                            const newChainIdHex = await this.provider.request({ method: 'eth_chainId' });
                            chainId = parseInt(newChainIdHex, 16);
                            log('[SIWE] Chain after switch attempt: ' + chainId, 'info');
                            
                            if (chainId !== this._expectedChainId) {
                                const failedMsg = `Failed to switch network. Please manually switch to ${networkName}.`;
                                log('[SIWE] Network switch verification failed', 'error');
                                alert(failedMsg);
                                throw new Error(failedMsg);
                            }
                            
                            log('[SIWE] Successfully switched to chain: ' + chainId, 'success');
                        } catch (switchError) {
                            log('[SIWE] Network switch failed: ' + switchError.message, 'error');
                            if (switchError.message && switchError.message.includes('Failed to switch')) {
                                throw switchError;
                            }
                            alert(errorMsg);
                            throw new Error(errorMsg);
                        }
                    }
                }
                
                // Get SIWE message - either from mock or real backend
                let message;
                const useMock = document.getElementById('useMockBackend').checked;
                
                if (useMock) {
                    log('[SIWE] Using mock backend for message generation', 'info');
                    const result = MockBackend.getMessage(address, chainId);
                    message = result.message;
                } else {
                    const backendUrl = document.getElementById('backendUrl').value.trim();
                    log('[SIWE] Fetching message from: ' + backendUrl, 'info');
                    
                    const response = await fetch(`${backendUrl}/discourse-siwe/message?eth_account=${address}&chain_id=${chainId}`, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Backend error: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    message = data.message;
                }
                
                log('[SIWE] Got message, requesting signature...', 'info');
                
                // Sign the message
                const signature = await this.provider.request({
                    method: 'personal_sign',
                    params: [message, address]
                });
                
                return [name || address, message, signature, avatar];
            }
            
            async runSigningProcess(cb, options = {}) {
                this.parseUrlParams();
                
                if (options.returnTo) {
                    this._returnTo = options.returnTo;
                }
                
                // Clean up any previous subscription
                if (this._currentUnsubscribe) {
                    try {
                        this._currentUnsubscribe();
                    } catch (e) {
                        log('[SIWE] Cleanup previous subscription', 'info');
                    }
                    this._currentUnsubscribe = null;
                }
                
                let isProcessing = false;
                let hasCompleted = false;
                let initialCheckDone = false;
                
                const callback = cb;
                const self = this;
                
                const unsubscribeResult = this.modal.subscribeAccount(async (account) => {
                    if (!initialCheckDone) {
                        initialCheckDone = true;
                        
                        if (account.isConnected && account.address && self._expectedWallet) {
                            const connectedLower = account.address.toLowerCase();
                            if (connectedLower === self._expectedWallet) {
                                log('[SIWE] Auto-connect: wallet matches expected address', 'info');
                            } else {
                                log('[SIWE] Auto-connect: connected wallet does not match expected', 'warn');
                                return;
                            }
                        } else if (account.isConnected) {
                            log('[SIWE] Existing connection detected, waiting for user action', 'info');
                            return;
                        } else {
                            return;
                        }
                    }
                    
                    if (isProcessing || hasCompleted) {
                        log('[SIWE] Skipping - already processing or completed', 'warn');
                        return;
                    }
                    
                    if (account.isConnected && account.address) {
                        if (self._expectedWallet) {
                            const connectedLower = account.address.toLowerCase();
                            if (connectedLower !== self._expectedWallet) {
                                log('[SIWE] Connected wallet does not match expected', 'warn');
                                return;
                            }
                        }
                        
                        isProcessing = true;
                        self.connectedAddress = account.address;
                        log('[SIWE] Wallet connected: ' + account.address, 'success');
                        
                        await new Promise(resolve => setTimeout(resolve, 500));
                        
                        if (self.provider) {
                            try {
                                log('[SIWE] Starting sign message flow', 'info');
                                const result = await self.signMessage(account.address);
                                log('[SIWE] Sign successful, calling callback', 'success');
                                hasCompleted = true;
                                
                                try {
                                    if (self._currentUnsubscribe && typeof self._currentUnsubscribe === 'function') {
                                        self._currentUnsubscribe();
                                    }
                                } catch (e) {
                                    log('[SIWE] Unsubscribe error (non-fatal): ' + e.message, 'warn');
                                }
                                
                                self._currentUnsubscribe = null;
                                
                                if (typeof callback === 'function') {
                                    callback(result);
                                }
                            } catch (e) {
                                log('[SIWE] Sign process error: ' + e.message, 'error');
                                isProcessing = false;
                            }
                        } else {
                            log('[SIWE] Provider not ready, waiting...', 'warn');
                            isProcessing = false;
                        }
                    }
                });
                
                log('[SIWE] subscribeAccount returned: ' + typeof unsubscribeResult, 'info');
                
                this._currentUnsubscribe = typeof unsubscribeResult === 'function' 
                    ? unsubscribeResult 
                    : (unsubscribeResult && typeof unsubscribeResult.unsubscribe === 'function' 
                        ? () => unsubscribeResult.unsubscribe()
                        : null);
                
                await new Promise(resolve => setTimeout(resolve, 100));
                
                log('[SIWE] Opening wallet modal', 'info');
                if (this._expectedWallet) {
                    log('[SIWE] Expected wallet: ' + this._expectedWallet, 'info');
                }
                this.modal.open();
            }
        }
        
        // ============================================
        // CONTROLLER SIMULATION - Matches actual plugin
        // ============================================
        
        // Module-level state (like in the actual plugin)
        let web3ModalInstance = null;
        let isInitialized = false;
        let autoConnectTriggered = false;  // NEW: Prevents duplicate auto-connect
        let authInProgress = false;        // NEW: Prevents concurrent auth flows
        
        function verifySignature(account, message, signature, avatar) {
            log('=== CALLBACK EXECUTED ===', 'success');
            log('Account: ' + account, 'info');
            log('Message length: ' + message.length + ' chars', 'info');
            log('Signature: ' + signature.substring(0, 20) + '...', 'info');
            
            // Validate with mock backend
            const useMock = document.getElementById('useMockBackend').checked;
            if (useMock) {
                const validation = MockBackend.validateCallback(message, signature);
                if (!validation.success) {
                    log('=== BACKEND VALIDATION FAILED ===', 'error');
                    log('Error: ' + validation.error, 'error');
                    log('Message: ' + validation.message, 'error');
                    return;
                }
                log('=== BACKEND VALIDATION SUCCESS ===', 'success');
            }
            
            const formData = {
                eth_account: account,
                eth_message: message,
                eth_signature: signature,
                eth_avatar: avatar || ''
            };
            
            document.getElementById('formData').textContent = JSON.stringify(formData, null, 2);
            document.getElementById('formResult').style.display = 'block';
            
            log('Form would be submitted to: /auth/siwe/callback', 'success');
        }
        
        async function initAuth() {
            // NEW: Prevent duplicate auth flows (matches plugin fix)
            if (authInProgress) {
                log('[Controller] Auth already in progress, skipping', 'warn');
                return;
            }
            authInProgress = true;
            
            try {
                const chainSelect = document.getElementById('chainId');
                const chainId = chainSelect.value;
                const chainName = chainSelect.options[chainSelect.selectedIndex].text.split(' ')[0];
                
                const env = {
                    PROJECT_ID: document.getElementById('projectId').value.trim(),
                    CHAIN_ID: chainId,
                    CHAIN_NAME: chainName,
                };
                
                if (!web3ModalInstance) {
                    web3ModalInstance = new Web3Modal();
                }
                
                if (!isInitialized) {
                    log('[Controller] Initializing AppKit...', 'info');
                    await web3ModalInstance.providerInit(env);
                    isInitialized = true;
                    log('[Controller] AppKit initialized', 'success');
                }
                
                await web3ModalInstance.runSigningProcess((res) => {
                    try {
                        const [account, message, signature, avatar] = res;
                        verifySignature(account, message, signature, avatar);
                    } catch (e) {
                        log('[Controller] Verify error: ' + e.message, 'error');
                        authInProgress = false;
                    }
                }, {});
            } catch (e) {
                log('[Controller] Init auth error: ' + e.message, 'error');
                authInProgress = false;
            }
        }
        
        // ============================================
        // UI HANDLERS
        // ============================================
        
        const statusDiv = document.getElementById('status');
        const testBtn = document.getElementById('testBtn');
        const resetBtn = document.getElementById('resetBtn');
        const hardResetBtn = document.getElementById('hardResetBtn');
        
        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            statusDiv.appendChild(p);
            statusDiv.scrollTop = statusDiv.scrollHeight;
            console.log(`[${type}]`, message);
        }
        
        async function testPluginFlow() {
            statusDiv.innerHTML = '';
            document.getElementById('formResult').style.display = 'none';
            MockBackend.reset();
            
            const projectId = document.getElementById('projectId').value.trim();
            if (!projectId) {
                log('Please enter a WalletConnect Project ID', 'error');
                return;
            }
            
            log('=== Starting Plugin Flow Test ===', 'info');
            
            // Check if we should simulate the duplicate init bug
            const simulateDuplicate = document.getElementById('simulateDuplicate').checked;
            if (simulateDuplicate) {
                log('=== SIMULATING DUPLICATE INIT BUG ===', 'warn');
                log('This will call initAuth() twice rapidly, like the Ember bug', 'warn');
                
                // Reset the guards to simulate the bug before our fix
                autoConnectTriggered = false;
                authInProgress = false;
                
                // Call twice rapidly - this is what was happening in Ember
                initAuth();
                setTimeout(() => initAuth(), 100);  // Second call 100ms later
            } else {
                initAuth();
            }
        }
        
        testBtn.addEventListener('click', testPluginFlow);
        
        resetBtn.addEventListener('click', () => {
            statusDiv.innerHTML = '';
            document.getElementById('formResult').style.display = 'none';
            MockBackend.reset();
            authInProgress = false;  // Reset auth flag
            log('Reset complete - ready for new test', 'info');
        });
        
        hardResetBtn.addEventListener('click', () => {
            statusDiv.innerHTML = '';
            document.getElementById('formResult').style.display = 'none';
            web3ModalInstance = null;
            isInitialized = false;
            autoConnectTriggered = false;
            authInProgress = false;
            MockBackend.reset();
            log('Hard reset complete - all state cleared', 'info');
        });
        
        // Initial check
        log('Test page loaded. Browser: ' + navigator.userAgent.split(' ').pop(), 'info');
        if (window.ethereum) {
            log('Injected wallet detected (MetaMask/etc)', 'success');
        } else {
            log('No injected wallet - WalletConnect will be used', 'warn');
        }
    </script>
</body>
</html>
